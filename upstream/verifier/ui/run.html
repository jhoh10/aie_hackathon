<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vouch verification</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1c1b18;--dim:#6d6a62;--line:#e2dfd6;--ok:#14733f;--okbg:#e4f3ea;--bad:#b3261e;--badbg:#fbe9e7;--warn:#8a5a00;--warnbg:#fbf1da;--accent:#1c1b18;--on:#fff;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--panel:#1d1d1a;--ink:#ecebe6;--dim:#a09d94;--line:#33322d;--ok:#62c98f;--okbg:#17291f;--bad:#f2877f;--badbg:#321a18;--warn:#e3b85a;--warnbg:#2e2614;--accent:#ecebe6;--on:#141412}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:940px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:12px;color:var(--dim);font-family:var(--mono)}h1{font-size:22px;line-height:1.25;margin:4px 0 0;font-weight:650;overflow-wrap:anywhere}
.badge{font-weight:700;font-size:14px;padding:8px 14px;border-radius:7px;white-space:nowrap;border:1px solid var(--line);background:var(--panel)}
.PASS{background:var(--okbg);color:var(--ok);border-color:transparent}.BLOCK{background:var(--badbg);color:var(--bad);border-color:transparent}.NEEDS_HUMAN{background:var(--warnbg);color:var(--warn);border-color:transparent}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 12px;font-weight:650}
.issue{white-space:pre-wrap;color:var(--dim);font-size:14px;margin:0 0 14px;overflow-wrap:anywhere}
textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical;min-height:44px;margin-bottom:8px}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;margin-bottom:8px}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--on);border:0;border-radius:6px;padding:9px 15px;min-height:40px;cursor:pointer}button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.claim{padding:12px 0;border-top:1px solid var(--line)}.claim:first-of-type{border-top:0;padding-top:0}.claim b{font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:650;padding:1px 8px;border-radius:5px;white-space:nowrap}
.proven,.pass{background:var(--okbg);color:var(--ok)}.failed,.fail{background:var(--badbg);color:var(--bad)}.unproven,.not_distinguishing,.inconclusive,.setup_error,.unknown,.minor{background:var(--warnbg);color:var(--warn)}.undeclared,.breaking{background:var(--badbg);color:var(--bad)}.explained{background:var(--line);color:var(--dim)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:8px}th{text-align:left;font-weight:600;color:var(--dim);font-size:12px}td,th{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}td.id{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
details{margin-top:6px}summary{cursor:pointer;color:var(--dim);font-size:13px;min-height:24px}pre{font:12px/1.45 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:320px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.muted{color:var(--dim);font-size:13.5px}.reason{margin:4px 0}.mono{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}.pulse{animation:p 1.4s infinite}@keyframes p{50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style></head><body><main id="app"><p class="muted">Loading…</p></main>
<script>
const id=location.pathname.split('/').pop();const app=document.getElementById('app');let state=null,draft=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chip=(t,l)=>`<span class="chip ${esc(t)}">${esc(l??String(t).replaceAll('_',' '))}</span>`;
const WORD={proven:'Proven',failed:'Failed',unproven:'Not proven'};
const RES={proven:'Fails on old, passes on new',not_distinguishing:'Passes on both',failed:'Fails on new',inconclusive:'Inconclusive'};
const trace=r=>(r?.steps??[]).map(s=>`${s.method} ${s.path}\n→ ${s.responseStatus??'no response'} ${JSON.stringify(s.responseBody)?.slice(0,700)??''}${s.failures?.length?`\n✗ ${s.failures.join('; ')}`:''}`).join('\n\n')||r?.error||'No steps ran';
const evidence=(b,h)=>`<details><summary>Evidence</summary><div class="cols"><div><div class="muted">Old version</div><pre>${esc(trace(b))}</pre></div><div><div class="muted">New version</div><pre>${esc(trace(h))}</pre></div></div></details>`;
function render(){const r=state;if(!r){app.innerHTML='<p class="muted">No run with this ID.</p>';return}
const focused=document.activeElement&&['TEXTAREA','INPUT'].includes(document.activeElement.tagName);if(focused)return;
const v=r.result?.verdict;const label=r.override?'OVERRIDDEN':v==='NEEDS_HUMAN'?'NEEDS A HUMAN':v;
const phase={extracting:'Reading the intent',awaiting_approval:'Merge blocked: approve intent',running:'Merge blocked: verifying',error:'Verifier error, merge blocked'}[r.phase];
let h=`<header><div><div class="eyebrow">vouch · ${esc(r.head?.slice(0,10))} against ${esc(r.base?.slice(0,10))}</div><h1>${esc(r.title)}</h1></div><div class="badge ${r.override?'':esc(v??'')} ${r.phase==='running'?'pulse':''}">${esc(label??phase)}</div></header>`;
if(r.error)h+=`<section><h2>Error</h2><pre>${esc(r.error)}</pre></section>`;
h+=`<section><h2>1 · Intent</h2><p class="issue">${esc(r.issue)}</p>`;
if(r.intentSource==='pr_description')h+=`<p class="reason">${chip('unknown','No linked issue')} This intent was written by the PR author, so read it closely.</p>`;
if(r.phase==='awaiting_approval'){draft=draft??r.claims;h+=draft.map((c,i)=>`<textarea data-i="${i}" aria-label="Claim ${i+1}" rows="2">${esc(c.text)}</textarea>`).join('')+`<button id="approve">Approve and lock these claims</button><p class="muted">Checks get written from these claims alone. The writer never sees the code.</p>`}
else if(r.claims&&!r.result)h+=r.claims.map(c=>`<div class="claim">${esc(c.text)}</div>`).join('');
else if(r.phase==='extracting')h+='<p class="muted pulse">Extracting claims…</p>';
h+='</section>';
if(r.phase==='running'||r.result){h+=`<section><h2>2 · Claims on old and new versions</h2>`;
if(r.result)h+=r.result.claims.map(c=>`<div class="claim">${chip(c.result,WORD[c.result])} <b>${esc(c.text)}</b><div class="tw"><table><tr><th>Check</th><th>Old</th><th>New</th><th>Reading</th></tr>${c.scenarios.map(s=>`<tr><td class="id">${esc(s.id)}</td><td>${chip(s.base)}</td><td>${chip(s.head)}</td><td>${esc(RES[s.result])}</td></tr><tr><td colspan="4">${evidence(s.evidence.base,s.evidence.head)}</td></tr>`).join('')}</table></div></div>`).join('');
else h+=`<div class="tw"><table><tr><th>Check</th><th>Old</th><th>New</th></tr>${r.scenarios.map(s=>`<tr><td class="id">${esc(s.id)}</td><td>${chip(s.base)}</td><td>${chip(s.head)}</td></tr>`).join('')}</table></div><p class="muted pulse">${r.lastEvent==='locked'?'Checks locked. Building both versions in the sandbox…':'Running…'}</p>`;h+='</section>'}
if(r.result){const p=r.result.probes;const ch=p.runs.filter(x=>x.changed);
h+=`<section><h2>3 · What else changed</h2><p class="muted">${p.total} probes ran on both versions. ${ch.length} responded differently${p.unstable.length?`, and ${p.unstable.length} gave unstable results so they were ignored`:''}.</p>`+ch.map(x=>{const t=p.triage.find(f=>f.id===x.id);return `<div class="claim"><span class="mono">${esc(x.id)}</span> ${t?chip(t.triage):chip('unknown')} ${t?.severity?chip(t.severity):''}<div class="muted">${esc(t?.why)}</div>${evidence(x.base,x.head)}</div>`}).join('')+'</section>';
const rc=r.result.reach;h+=`<section><h2>4 · Not verified</h2><p>The checks ran <b>${rc.reached} of ${rc.total}</b> changed statements.</p>${rc.unreached.length?`<div class="tw"><table><tr><th>Unreached changed code</th></tr>${rc.unreached.slice(0,12).map(u=>`<tr><td class="id">${esc(u.file)}:${u.line}</td></tr>`).join('')}</table></div>`:''}<p class="muted">Passing means these claims held in this sandbox. It doesn't cover scale, real integrations or untried inputs.</p></section>`;
h+=`<section><h2>Decision</h2>${r.result.reasons.length?r.result.reasons.map(x=>`<p class="reason">${esc(x)}</p>`).join(''):'<p class="reason">Every approved claim was proven and nothing unexplained changed.</p>'}<p class="muted mono">lock ${esc(r.result.lock.slice(0,16))}</p>`;
if(r.override)h+=`<p class="reason">${chip('unknown','Override')} ${esc(r.override.by)}: ${esc(r.override.reason)}</p>`;
else if(v!=='PASS')h+=`<details><summary>Override this decision</summary><input id="by" placeholder="Your name" aria-label="Your name"><textarea id="why" placeholder="Why it's safe to merge anyway" aria-label="Reason"></textarea><button class="ghost" id="ov">Record override and unblock</button></details>`;h+='</section>'}
app.innerHTML=h;
document.querySelectorAll('textarea[data-i]').forEach(t=>t.oninput=()=>draft[+t.dataset.i]={...draft[+t.dataset.i],text:t.value});
const a=document.getElementById('approve');if(a)a.onclick=async()=>{a.disabled=true;await fetch(`/api/runs/${id}/approve`,{method:'POST',body:JSON.stringify({claims:draft})})};
const o=document.getElementById('ov');if(o)o.onclick=async()=>{await fetch(`/api/runs/${id}/override`,{method:'POST',body:JSON.stringify({by:document.getElementById('by').value,reason:document.getElementById('why').value})})};}
const es=new EventSource(`/api/runs/${id}/events`);es.onmessage=e=>{state=JSON.parse(e.data);render()};es.onerror=()=>{if(!state)render()};
</script></body></html>
